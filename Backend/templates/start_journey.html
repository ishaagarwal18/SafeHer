{% load static %}

<!DOCTYPE html>
<html>
<head>
<title>Journey</title>
<link rel="stylesheet" href="{% static 'css/features.css' %}">
</head>

<body>

<div class="container">

<h1 class="page-title">
🚖 Start Journey
</h1>

<div class="card">
<form method="POST">

{% csrf_token %}

<input type="text"
name="source"
placeholder="Source" required>

<input type="text"
name="destination"
placeholder="Destination" required>

<select name="transport">

<option>Car</option>
<option>Bus</option>
<option>Train</option>

</select>

<button class="btn" type="submit">
Start Journey
</button>

</form>
</div>

<div class="card">
<h2>Recent Journeys</h2>
<table>

<tr>
<th>Source</th>
<th>Destination</th>
<th>Transport</th>
<th>Status</th>
<th>Action</th>
</tr>

{% for j in journeys %}

<tr>
<td>{{ j.source }}</td>
<td>{{ j.destination }}</td>
<td>{{ j.transport_mode }}</td>
<td><span class="status-pill">{{ j.status }}</span></td>
<td>
    <button type="button" class="btn-sm" onclick="openGoogleMaps('{{ j.source|escapejs }}', '{{ j.destination|escapejs }}', '{{ j.transport_mode|escapejs }}')">
        Open Map
    </button>
</td>
</tr>

{% empty %}
<tr>
    <td colSpan="5" style="text-align: center;">No Journey Found</td>
</tr>
{% endfor %}

</table>

</div>

</div>

<div class="nav-links">
    <a href="/dashboard/" class="btn">
        Back to Dashboard
    </a>
</div>

<script>
function openGoogleMaps(source, destination, transport) {
    let mode = 'driving';
    if (transport && (transport.toLowerCase() === 'bus' || transport.toLowerCase() === 'train')) {
        mode = 'transit';
    }
    const url = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(source)}&destination=${encodeURIComponent(destination)}&travelmode=${mode}`;
    window.open(url, '_blank');
}
</script>
</body>
</html>
